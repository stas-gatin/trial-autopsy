name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Tests and offline replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAMPLE_MODE: "true"
      METERLESS_AUTOSTART: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and offline end-to-end tests
        run: python -m unittest discover tests
      - name: Page, assets and every recorded analysis load without internet
        run: python scripts/check_offline.py
      - name: Every recorded analysis replays to the same result as its live run
        run: python scripts/check_replay.py

  meterless:
    name: Meterless World Model conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/meterless/package-lock.json
      - run: npm --prefix services/meterless ci
      - run: npm --prefix services/meterless run conformance
