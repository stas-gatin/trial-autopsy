<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img"
  aria-label="Blind backtest on 36 finished trials: outcome right 16 of 22, main cause 26 of 36, cause named 35 of 36, expected hazard ratio within 0.03 8 of 25; 373 of 377 reasoning calls through Meterless Nightshift.">
