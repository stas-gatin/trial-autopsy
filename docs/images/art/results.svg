  </style></defs>
  <rect width="1280" height="230" rx="24" fill="#f7f9fb" stroke="#dfe5ec"/>
  <text x="40" y="38" class="t" font-size="13" font-weight="700" letter-spacing="2" fill="#0b6e79">BLIND BACKTEST · 14 FINISHED TRIALS · SCORED AGAINST THE EXPERTS' LATER EXPLANATIONS</text>
  
