<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img"
  aria-label="Blind backtest on 14 finished trials: outcome right 9 of 9, main cause 10 of 14, cause named 11 of 14, expected hazard ratio within 0.03 10 of 13; 132 of 132 reasoning calls through Meterless Nightshift.">
