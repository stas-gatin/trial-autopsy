      <text x="470" y="303" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3 Ultra 550B</text>
      <text x="684" y="303" class="t" font-size="13" fill="#3c4a5e">through Meterless Nightshift</text>
      <rect x="900" y="290" width="300" height="14" rx="7" fill="#edf1f5"/>
