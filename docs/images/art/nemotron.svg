      <text x="900" y="322" class="t" font-size="11" fill="#6b7a90">1 direct after Nightshift cuts</text>
    </g>
    <g class="row" style="animation-delay:1.50s">
      <text x="40" y="352" class="t" font-size="15" font-weight="700" fill="#142133">Reporter</text>
      <text x="40" y="371" class="t" font-size="12" fill="#6b7a90">writes the report</text>
      <rect x="430" y="337" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,343) scale(21,14)"/>
      <text x="470" y="355" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3 Ultra 550B</text>
      <text x="684" y="355" class="t" font-size="13" fill="#3c4a5e">through Meterless Nightshift</text>
      <rect x="900" y="342" width="300" height="14" rx="7" fill="#edf1f5"/>
      <rect x="900" y="342" width="0" height="14" rx="7" fill="#5a8f00">
        <animate attributeName="width" from="0" to="21.7" dur="1.2s" begin="1.80s" fill="freeze"/>
      </rect>
      <text x="1240" y="354" class="t" font-size="15" font-weight="700" fill="#142133" text-anchor="end">41</text>
      <text x="900" y="374" class="t" font-size="11" fill="#6b7a90">5 on 3.5 Super</text>
    </g>
    <g class="row" style="animation-delay:1.80s">
      <text x="40" y="404" class="t" font-size="15" font-weight="700" fill="#142133">Read-through</text>
      <text x="40" y="423" class="t" font-size="12" fill="#6b7a90">forecasts the rival drugs on the same target</text>
      <rect x="430" y="389" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,395) scale(21,14)"/>
      <text x="470" y="407" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3.5 Super 120B</text>
