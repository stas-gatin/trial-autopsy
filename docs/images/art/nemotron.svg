<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img"
  aria-label="Built on NVIDIA Nemotron: 945 model calls in 41 recorded analyses, by step, model and route.">
  <defs><image id="logo-nvidia-mark" href="data:image/svg+xml;base64," width="1" height="1" preserveAspectRatio="xMidYMid meet"/><style>
    .t { font-family: 'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif; }
    .row { opacity: 0; animation: up 0.6s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style></defs>
  <rect width="1280" height="480" rx="24" fill="#f7f9fb" stroke="#dfe5ec"/>
  <text x="40" y="44" class="t" font-size="13" font-weight="700" letter-spacing="2" fill="#5a8f00">BUILT ON NVIDIA NEMOTRON · 945 MODEL CALLS IN 41 RECORDED ANALYSES</text>
  <text x="1240" y="44" class="t" font-size="12" fill="#6b7a90" text-anchor="end">calls per step, counted from the run traces</text>
  
    <g class="row" style="animation-delay:0.00s">
      <text x="40" y="92" class="t" font-size="15" font-weight="700" fill="#142133">Case builder</text>
      <text x="40" y="111" class="t" font-size="12" fill="#6b7a90">reads every document, extracts facts with quotes</text>
      <rect x="430" y="77" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,83) scale(21,14)"/>
      <text x="470" y="95" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3.5 Super 120B</text>
      <text x="684" y="95" class="t" font-size="13" fill="#3c4a5e">NVIDIA API, reasoning off</text>
      <rect x="900" y="82" width="300" height="14" rx="7" fill="#edf1f5"/>
      <rect x="900" y="82" width="0" height="14" rx="7" fill="#5a8f00">
        <animate attributeName="width" from="0" to="300.0" dur="1.2s" begin="0.30s" fill="freeze"/>
      </rect>
      <text x="1240" y="94" class="t" font-size="15" font-weight="700" fill="#142133" text-anchor="end">567</text>
      <text x="900" y="114" class="t" font-size="11" fill="#6b7a90"></text>
    </g>
    <g class="row" style="animation-delay:0.30s">
      <text x="40" y="144" class="t" font-size="15" font-weight="700" fill="#142133">Mechanism analyst</text>
      <text x="40" y="163" class="t" font-size="12" fill="#6b7a90">turns the facts into calculator inputs</text>
      <rect x="430" y="129" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,135) scale(21,14)"/>
      <text x="470" y="147" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3 Ultra 550B</text>
      <text x="684" y="147" class="t" font-size="13" fill="#3c4a5e">through Meterless Nightshift</text>
      <rect x="900" y="134" width="300" height="14" rx="7" fill="#edf1f5"/>
      <rect x="900" y="134" width="0" height="14" rx="7" fill="#5a8f00">
        <animate attributeName="width" from="0" to="37.0" dur="1.2s" begin="0.60s" fill="freeze"/>
