      <text x="900" y="166" class="t" font-size="11" fill="#6b7a90">2 on 3.5 Super</text>
    </g>
    <g class="row" style="animation-delay:0.60s">
      <text x="40" y="196" class="t" font-size="15" font-weight="700" fill="#142133">Verifier</text>
      <text x="40" y="215" class="t" font-size="12" fill="#6b7a90">writes the SQL that re-checks each number in Zetaris</text>
      <rect x="430" y="181" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,187) scale(21,14)"/>
      <text x="470" y="199" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3 Ultra 550B</text>
      <text x="684" y="199" class="t" font-size="13" fill="#3c4a5e">through Meterless Nightshift</text>
      <rect x="900" y="186" width="300" height="14" rx="7" fill="#edf1f5"/>
