      <rect x="430" y="233" width="236" height="26" rx="13" fill="#f3f9e8" stroke="#a8d36a"/>
      <use href="#logo-nvidia-mark" transform="translate(442,239) scale(21,14)"/>
      <text x="470" y="251" class="t" font-size="13" font-weight="700" fill="#5a8f00">Nemotron 3 Ultra 550B</text>
