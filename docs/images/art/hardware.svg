<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img"
  aria-label="The path to your own hardware: every model call goes to an OpenAI-compatible endpoint. Used: the NVIDIA API and Meterless Nightshift on a Mac. Possible with no code change, not run: a Nightshift lane on an NVIDIA DGX Spark, or an NVIDIA NIM serving Nemotron on site.">
  <defs><image id="logo-nvidia-mark" href="data:image/svg+xml;base64," width="1" height="1" preserveAspectRatio="xMidYMid meet"/><style>
    .t { font-family: 'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif; }
    .dash { animation: run 1.6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -26; } }
  </style></defs>
  <rect width="1280" height="520" rx="24" fill="#f7f9fb" stroke="#dfe5ec"/>
  <text x="40" y="40" class="t" font-size="13" font-weight="700" letter-spacing="2" fill="#5a8f00">THE PATH TO YOUR OWN NVIDIA HARDWARE</text>
  <g class="t">
    <rect x="40" y="190" width="380" height="140" rx="14" fill="#ffffff" stroke="#0b6e79" stroke-width="2"/>
    <text x="64" y="226" font-size="17" font-weight="700" fill="#142133">Trial Autopsy</text>
    <text x="64" y="252" font-size="13" fill="#3c4a5e">agents, prompts, checks, recordings</text>
    <text x="64" y="276" font-size="13" fill="#3c4a5e">one OpenAI-compatible endpoint</text>
    <text x="64" y="306" font-size="12" class="m" fill="#6b7a90" font-family="'IBM Plex Mono',SFMono-Regular,Menlo,Consolas,monospace">NVIDIA_BASE_URL · METERLESS_URL</text>
  </g>
  <path d="M420 260 C 560 260, 560 94, 700 94" fill="none" stroke="#5a8f00" stroke-width="2.4" stroke-dasharray="0" class=""/><circle r="5" fill="#5a8f00"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M420 260 C 560 260, 560 94, 700 94"/></circle><circle r="5" fill="#5a8f00"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M420 260 C 560 260, 560 94, 700 94"/></circle><path d="M420 260 C 560 260, 560 204, 700 204" fill="none" stroke="#5a8f00" stroke-width="2.4" stroke-dasharray="0" class=""/><circle r="5" fill="#5a8f00"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M420 260 C 560 260, 560 204, 700 204"/></circle><circle r="5" fill="#5a8f00"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M420 260 C 560 260, 560 204, 700 204"/></circle><path d="M420 260 C 560 260, 560 314, 700 314" fill="none" stroke="#9aa8b8" stroke-width="2.4" stroke-dasharray="7 6" class="dash"/><path d="M420 260 C 560 260, 560 424, 700 424" fill="none" stroke="#9aa8b8" stroke-width="2.4" stroke-dasharray="7 6" class="dash"/>
  
    <g class="t">
      <rect x="700" y="60" width="540" height="68" rx="14" fill="#f3f9e8" stroke="#a8d36a" stroke-width="2"/>
      <use href="#logo-nvidia-mark" transform="translate(718,76) scale(27,18)"/>
      <text x="756" y="90" font-size="15" font-weight="700" fill="#142133">NVIDIA API (build.nvidia.com)</text>
      <text x="756" y="111" font-size="12" fill="#6b7a90">extraction, reasoning off · used in every run</text>
      <text x="1224" y="90" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5a8f00" text-anchor="end">RAN</text>
    </g>
    <g class="t">
      <rect x="700" y="170" width="540" height="68" rx="14" fill="#f3f9e8" stroke="#a8d36a" stroke-width="2"/>
      <use href="#logo-nvidia-mark" transform="translate(718,186) scale(27,18)"/>
      <text x="756" y="200" font-size="15" font-weight="700" fill="#142133">Meterless Nightshift on a Mac</text>
      <text x="756" y="221" font-size="12" fill="#6b7a90">every reasoning step · used in every run</text>
      <text x="1224" y="200" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5a8f00" text-anchor="end">RAN</text>
    </g>
    <g class="t">
      <rect x="700" y="280" width="540" height="68" rx="14" fill="#ffffff" stroke="#b8c4d2" stroke-width="2" stroke-dasharray="7 6"/>
      <use href="#logo-nvidia-mark" transform="translate(718,296) scale(27,18)"/>
      <text x="756" y="310" font-size="15" font-weight="700" fill="#142133">Nightshift lane on an NVIDIA DGX Spark</text>
      <text x="756" y="331" font-size="12" fill="#a15c07">same app, same Nightshift setup · not run</text>
      <text x="1224" y="310" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7a90" text-anchor="end">POSSIBLE</text>
    </g>
    <g class="t">
      <rect x="700" y="390" width="540" height="68" rx="14" fill="#ffffff" stroke="#b8c4d2" stroke-width="2" stroke-dasharray="7 6"/>
      <use href="#logo-nvidia-mark" transform="translate(718,406) scale(27,18)"/>
      <text x="756" y="420" font-size="15" font-weight="700" fill="#142133">NVIDIA NIM serving Nemotron, on site</text>
      <text x="756" y="441" font-size="12" fill="#a15c07">set NVIDIA_BASE_URL · not run</text>
      <text x="1224" y="420" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6b7a90" text-anchor="end">POSSIBLE</text>
    </g>
  <text x="40" y="496" class="t" font-size="12" fill="#6b7a90">Moving to a DGX Spark or a local NIM changes one setting, not the code, and unpublished trial data never leaves the company. I ran on NVIDIA's API and on Nightshift on a Mac, not on a DGX Spark.</text>
</svg>
